    } else if (f.mode === 'running' || f.mode === 'paused') {
      var r = 120, c = 2 * Math.PI * r, p = f.minutes > 0 ? (f.minutes * 60 - f.remaining) / (f.minutes * 60) : 0;
      o += '<div class="timerwrap"><p class="sub" style="font-weight:600;text-align:center">' + esc(task ? task.title : 'Free study') + '</p><div class="ring"><svg viewBox="0 0 288 288"><circle class="track" cx="144" cy="144" r="' + r + '" fill="none" stroke-width="14"/><circle class="prog" id="ringp" cx="144" cy="144" r="' + r + '" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c - p * c) + '"/></svg>' +
        '<div class="time"><b id="tleft">' + fmtTime(f.remaining) + '</b><span id="tstate">' + (f.mode === 'paused' ? 'Paused' : 'Focusing…') + '</span></div></div>' +
        '<div class="row wrap" style="justify-content:center">' + (f.mode === 'running' ? '<button class="btn" style="height:48px" data-a="fpause">' + ico('pause') + 'Pause</button>' : '<button class="btn primary" style="height:48px" data-a="fresume">' + ico('play') + 'Resume</button>') +
        '<button class="btn primary" style="height:48px" data-a="ffinish">' + ico('ok') + 'Finish</button><button class="btn ghost" style="height:48px" data-a="freset" aria-label="Cancel session">' + ico('undo') + '</button></div>' +
        (f.dist.length ? '<div class="stack-s" style="align-items:center"><span class="small muted" style="font-weight:600">Off limits until you finish</span>' + distPills(false) + '</div>' : '') + '</div>';
    } else {
      var rf = UI.refl;
      o += '<div class="stack-s" style="gap:16px"><div class="card done-banner"><span class="ico">' + ico('ok') + '</span><div><h3 style="font-size:18px">Session complete!</h3><p class="sub">You focused for ' + f.actual + ' minute' + (f.actual === 1 ? '' : 's') + '.</p></div></div>' +
        '<form class="card stack-s" id="reflform" style="gap:16px"><div class="row" style="gap:8px"><span style="width:20px;color:var(--sun)">' + ico('bulb') + '</span><h3 style="font-size:18px">Learning reflection</h3></div><p class="sub">Take a moment to reflect. This helps you learn smarter, not just longer.</p>' +
        '<div class="field"><label for="r1">What did you complete?</label><textarea id="r1" data-bind="r1" style="min-height:70px" placeholder="I finished…">' + esc(rf.reflection_what_completed) + '</textarea></div>' +
        '<div class="field"><label for="r2">What was most difficult?</label><textarea id="r2" data-bind="r2" style="min-height:70px" placeholder="The hardest part was…">' + esc(rf.reflection_what_difficult) + '</textarea></div>' +
        '<div class="field"><span class="lbl">Did you understand what you studied?</span><div class="radios">' + [['yes', 'Yes, I get it', 'I understand the concepts'], ['partially', 'Partially', 'Some parts are still unclear'], ['no', 'Not yet', 'I need more help']].map(function (u) {
          return '<label class="radio"><span><input type="radio" name="understood" value="' + u[0] + '" data-bind="ru"' + (rf.reflection_understood === u[0] ? ' checked' : '') + '>' + u[1] + '</span><small>' + u[2] + '</small></label>';
        }).join('') + '</div></div>' +
        '<div class="field"><label for="r4">What should you do next?</label><textarea id="r4" data-bind="r4" style="min-height:70px" placeholder="Next time I will…">' + esc(rf.reflection_next_step) + '</textarea></div>' +
        '<div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-a="freset">' + ico('skip') + 'Skip</button><button type="submit" class="btn primary">' + ico('ok') + 'Save reflection</button></div></form></div>';
    }
    return o + '</div>';
  }
  function distPills(removable) {
    var d = UI.f.dist;
    if (!d.length) return '';
    return '<div class="pills">' + d.map(function (x, i) { return removable ? '<span class="pill">' + esc(x) + '<button data-a="remdist" data-i="' + i + '" aria-label="Remove ' + esc(x) + '">' + ico('x') + '</button></span>' : '<span class="pill static">' + esc(x) + '</span>'; }).join('') + '</div>';
  }

  function vSettings() {
    var d = UI.draft || (UI.draft = { lang: S.settings.lang, minutes: S.settings.minutes });
    return '<div class="stack">' + head('gear', 'Settings', 'Personalize your Lexora experience.') +
      '<div class="card stack-s" style="gap:22px"><div class="field"><label for="s-lang">Preferred explanation language</label><p class="sub">Default language for Language Studio explanations.</p><select id="s-lang" data-bind="slang">' + langOptions(d.lang) + '</select></div>' +
      '<div class="field"><label for="s-min">Default focus session length</label><p class="sub">Preset timer for Focus Mode.</p><select id="s-min" data-bind="smin">' + [15, 25, 45, 60].map(function (m) { return '<option value="' + m + '"' + (m === d.minutes ? ' selected' : '') + '>' + m + ' minutes</option>'; }).join('') + '</select></div>' +
      '<div><button class="btn primary" data-a="savesettings">' + ico('check') + 'Save settings</button></div></div>' +
      '<div class="card danger-zone stack-s"><h3>Delete my data</h3><p class="sub">Permanently remove all of your tasks, focus sessions, and saved vocabulary.</p>' +
      (UI.confirmDelete ? '<p style="font-weight:600;font-size:14px">This cannot be undone. Delete everything?</p><div class="row"><button class="btn danger" data-a="wipe">' + ico('trash') + 'Yes, delete everything</button><button class="btn" data-a="wipecancel">Cancel</button></div>' : '<div><button class="btn danger-o" data-a="wipeask">' + ico('trash') + 'Delete my data</button></div>') + '</div></div>';
  }

  function render() {
    var v = document.getElementById('view');
    var html = UI.route === 'home' ? vHome() : UI.route === 'planner' ? vPlanner() : UI.route === 'language' ? vLanguage() : UI.route === 'focus' ? vFocus() : vSettings();
    v.innerHTML = html;
    document.getElementById('tabs').innerHTML = NAV.map(function (n) { return '<button class="tab" data-a="nav" data-v="' + n[0] + '"' + (UI.route === n[0] ? ' aria-current="page"' : '') + '>' + ico(n[2]) + n[1] + '</button>'; }).join('');
    document.getElementById('logo').innerHTML = ico('book');
    var m = document.getElementById('modal'), had = m.firstChild;
    if (UI.modal) { if (!had) { m.innerHTML = taskModal(); var t = document.getElementById('tf-title'); if (t) t.focus(); } } else m.innerHTML = '';
  }

  /* ---------- focus timer ---------- */
  function startTick() {
    clearInterval(tick);
    tick = setInterval(function () {
      var f = UI.f; if (f.mode !== 'running') return;
      f.remaining = Math.max(0, Math.ceil((f.endAt - Date.now()) / 1000));
      var el = document.getElementById('tleft'); if (el) el.textContent = fmtTime(f.remaining);
      var rp = document.getElementById('ringp');
      if (rp) { var c = 2 * Math.PI * 120, p = (f.minutes * 60 - f.remaining) / (f.minutes * 60); rp.setAttribute('stroke-dashoffset', c - p * c); }
      if (f.remaining <= 0) finishSession();
    }, 250);
  }
  function finishSession() {
    var f = UI.f; if (f.mode !== 'running' && f.mode !== 'paused') return;
    clearInterval(tick);
    var elapsed = f.minutes * 60 - f.remaining, actual = Math.max(1, Math.round(elapsed / 60));
    var task = byId(S.tasks, f.taskId), id = uid();
    S.sessions.push({ id: id, task_id: task ? task.id : '', task_title: task ? task.title : 'Free study', subject: task ? task.subject : '', planned_minutes: f.minutes, actual_minutes: actual, status: 'completed', has_reflection: false, created: new Date().toISOString() });
    persist();
    f.sessionId = id; f.actual = actual; f.mode = 'done';
    UI.refl = { reflection_what_completed: '', reflection_what_difficult: '', reflection_understood: '', reflection_next_step: '' };
    toast('Session saved!', { desc: actual + ' min focused.' });
    render();
  }
  function resetFocus() { clearInterval(tick); var f = UI.f; f.mode = 'setup'; f.sessionId = null; f.remaining = 0; f.dist = []; f.minutes = S.settings.minutes || 25; render(); }

  /* ---------- actions ---------- */
  var A = {
    nav: function (el) { go(el.dataset.v); },
    filter: function (el) { UI.filter = el.dataset.v; UI.menu = null; render(); },
    newtask: function () { go('planner'); UI.modal = { task: null }; render(); },
    closemodal: function (el, e) { if (e.target !== el && el.classList.contains('modalback')) return; UI.modal = null; render(); },
    cycle: function (el) {
      var t = byId(S.tasks, el.dataset.id); if (!t) return;
      t.status = FLOW[(FLOW.indexOf(t.status) + 1) % 3]; t.updated = new Date().toISOString(); persist(); render();
    },
    step: function (el) {
      var t = byId(S.tasks, el.dataset.id); if (!t) return;
      var s = t.steps[+el.dataset.i]; if (s) s.completed = el.checked; t.updated = new Date().toISOString(); persist(); render();
    },
    expand: function (el) { UI.open[el.dataset.id] = !UI.open[el.dataset.id]; render(); },
    menu: function (el) { UI.menu = UI.menu === el.dataset.id ? null : el.dataset.id; render(); },
    edit: function (el) { UI.modal = { task: byId(S.tasks, el.dataset.id) }; UI.menu = null; render(); },
    del: function (el) {
      var i = S.tasks.findIndex(function (t) { return t.id === el.dataset.id; }); if (i < 0) return;
      var gone = S.tasks.splice(i, 1)[0]; UI.menu = null; persist(); render();
      toast('Task deleted', { undo: function () { S.tasks.splice(Math.min(i, S.tasks.length), 0, gone); persist(); render(); } });
    },
    breakdown: function (el) {
      var t = byId(S.tasks, el.dataset.id); if (!t || UI.breaking[t.id]) return;
      UI.breaking[t.id] = true; render();
      ai(breakdownPrompt(t), 'quick').then(function (r) {
        var steps = (r && r.steps || []).filter(function (s) { return s && s.title; }).map(function (s) { return { title: String(s.title), completed: false }; });
        if (!steps.length) throw new Error('No steps came back. Try again.');
        t.steps = steps; t.updated = new Date().toISOString(); UI.open[t.id] = true; persist();
        toast('Broke down into ' + steps.length + ' steps');
      }).catch(function (e) { toast('Breakdown failed', { err: true, desc: e.message }); })
        .then(function () { delete UI.breaking[t.id]; render(); });
    },
    focustask: function (el) { UI.f.taskId = el.dataset.id; UI.f.mode = 'setup'; go('focus'); },
    studiotab: function (el) { UI.tab = el.dataset.v; render(); },
    sample: function (el) { UI.input = SAMPLES[+el.dataset.i]; render(); },
    explain: function () {
      if (!UI.input.trim()) { toast('Please enter some text first', { err: true }); return; }
      var lang = UI.studioLang || S.settings.lang || 'es';
      UI.loading = true; UI.result = null; UI.saved = {}; UI.answers = {}; UI.checked = false; render();
      ai(explainPrompt(UI.input, lname(lang)[4]), 'default').then(function (r) {
        if (!r || !r.explanation) throw new Error('No result returned. Try again.');
        r.vocabulary = Array.isArray(r.vocabulary) ? r.vocabulary.filter(function (v) { return v && v.term; }) : [];
        r.quiz = Array.isArray(r.quiz) ? r.quiz.filter(function (q) { return q && q.question && Array.isArray(q.options) && q.options.length > 1 && Number.isInteger(q.correct_index); }) : [];
        r.explanationLang = lang; UI.result = r;
      }).catch(function (e) { toast('Something went wrong', { err: true, desc: e.message }); })
        .then(function () { UI.loading = false; render(); });
    },
    saveterm: function (el) {
      var v = UI.result && UI.result.vocabulary[+el.dataset.i]; if (!v) return;
      S.vocab.unshift({ id: uid(), term: v.term, translation: v.translation || '', definition: v.definition || '', example: v.example || '', explanation_language: UI.result.explanationLang || S.settings.lang, created: new Date().toISOString() });
      UI.saved[v.term] = true; persist(); toast('Saved to vocabulary', { desc: v.term }); render();
    },
    delvocab: function (el) { S.vocab = S.vocab.filter(function (v) { return v.id !== el.dataset.id; }); persist(); render(); },
    pick: function (el) { if (UI.checked) return; UI.answers[+el.dataset.q] = +el.dataset.o; render(); },
    quizcheck: function () { UI.checked = true; render(); },
    quizretry: function () { UI.answers = {}; UI.checked = false; render(); },
    preset: function (el) { UI.f.minutes = +el.dataset.v; render(); },
    adddist: function () {
      var i = document.getElementById('f-dist'), v = i && i.value.trim(); if (!v) return;
      if (UI.f.dist.indexOf(v) < 0) UI.f.dist.push(v); render(); var n = document.getElementById('f-dist'); if (n) n.focus();
    },
    remdist: function (el) { UI.f.dist.splice(+el.dataset.i, 1); render(); },
    fstart: function () { var f = UI.f; f.remaining = f.minutes * 60; f.endAt = Date.now() + f.remaining * 1000; f.mode = 'running'; startTick(); render(); },
    fpause: function () { var f = UI.f; f.remaining = Math.max(0, Math.ceil((f.endAt - Date.now()) / 1000)); f.mode = 'paused'; render(); },
    fresume: function () { var f = UI.f; f.endAt = Date.now() + f.remaining * 1000; f.mode = 'running'; render(); },
    ffinish: function () { finishSession(); },
    freset: function () { resetFocus(); },
    savesettings: function () {
      var d = UI.draft; S.settings.lang = d.lang; S.settings.minutes = d.minutes; UI.studioLang = null; persist();
      if (UI.f.mode === 'setup') UI.f.minutes = d.minutes; toast('Settings saved'); render();
    },
    wipeask: function () { UI.confirmDelete = true; render(); },
    wipecancel: function () { UI.confirmDelete = false; render(); },
    wipe: function () { S.tasks = []; S.sessions = []; S.vocab = []; UI.confirmDelete = false; UI.result = null; persist(); toast('All data deleted'); render(); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (UI.menu && !e.target.closest('.menu') && !(el && el.dataset.a === 'menu')) { UI.menu = null; if (!el) { render(); return; } }
    if (!el || el.tagName === 'INPUT') return;
    var fn = A[el.dataset.a]; if (fn) fn(el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.tagName === 'INPUT' && el.dataset.a === 'step') A.step(el);
  });
  document.addEventListener('input', function (e) {
    var el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
    if (b === 'input') UI.input = el.value;
    else if (b === 'r1') UI.refl.reflection_what_completed = el.value;
    else if (b === 'r2') UI.refl.reflection_what_difficult = el.value;
    else if (b === 'r4') UI.refl.reflection_next_step = el.value;
    else if (b === 'ru') UI.refl.reflection_understood = el.value;
  });
  document.addEventListener('change', function (e) {
    var el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
    if (b === 'studioLang') UI.studioLang = el.value;
    else if (b === 'ftask') { UI.f.taskId = el.value; render(); }
    else if (b === 'slang') UI.draft.lang = el.value;
    else if (b === 'smin') UI.draft.minutes = +el.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && UI.modal) { UI.modal = null; render(); }
    if (e.key === 'Enter' && e.target.id === 'f-dist') { e.preventDefault(); A.adddist(); }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    if (form.id === 'taskform') {
      var d = new FormData(form), title = String(d.get('title') || '').trim(); if (!title) return;
      var data = { title: title, subject: d.get('subject'), type: d.get('type'), due_date: d.get('due_date') || '', priority: d.get('priority'), estimated_minutes: d.get('estimated_minutes') ? Number(d.get('estimated_minutes')) : 0, notes: String(d.get('notes') || '').trim() };
      var now = new Date().toISOString();
      if (UI.modal.task) { Object.assign(UI.modal.task, data, { updated: now }); toast('Task updated'); }
      else { S.tasks.push(Object.assign({ id: uid(), status: 'not_started', steps: [], created: now, updated: now }, data)); toast('Task added'); }
      UI.modal = null; persist(); render();
    } else if (form.id === 'reflform') {
      var s = byId(S.sessions, UI.f.sessionId);
      if (s) { Object.assign(s, UI.refl, { has_reflection: true }); persist(); }
      toast('Reflection saved'); resetFocus();
    }
  });

  boot();
})();
</script>

</body></html>
